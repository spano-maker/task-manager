<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager – Standalone</title>
  <meta name="description" content="Task Manager standalone: CRUD, filtri, statistiche, import/export – senza build" />
  <style>
    /* -----------------------
       DESIGN SYSTEM (Specs)
       ----------------------- */
    :root {
      --primary: #1d4ed8;      /* Blu principale */
      --success: #22c55e;      /* Verde successo */
      --warning: #f97316;      /* Arancione warning */
      --danger: #dc2626;       /* Rosso pericolo */
      --yellow: #facc15;       /* Giallo media priorità */

      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;

      --text-xs: 0.75rem;     /* 12px */
      --text-sm: 0.875rem;    /* 14px */
      --text-base: 1rem;      /* 16px */
      --text-lg: 1.125rem;    /* 18px */
      --text-xl: 1.25rem;     /* 20px */
      --text-2xl: 1.5rem;     /* 24px */

      --container-max-width: 1200px;
      --grid-gap: 20px;
      --card-padding: 20px;
      --form-gap: 12px;

      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-full: 999px;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.2);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--gray-900); background: var(--gray-50); }
    a { color: var(--primary); text-decoration: none; }
    button { cursor: pointer; }

    .container { max-width: var(--container-max-width); margin: 0 auto; padding: 20px; }

    /* Header */
    header.app-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    .title { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    .title .emoji { font-size: 1.6rem; }
    .today { color: var(--gray-700); font-size: var(--text-sm); }

    /* Stats cards */
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 12px 0 18px; }
    @media (min-width: 768px) { .stats { grid-template-columns: repeat(4, 1fr); } }
    .stat { background: white; border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 6px; }
    .stat .label { color: var(--gray-500); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .value { font-size: 1.25rem; font-weight: 700; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 16px; }
    .tab { border: 1px solid var(--gray-200); background: white; color: var(--gray-900); border-radius: var(--radius-full); padding: 8px 14px; font-size: var(--text-sm); display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); }
    .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Toolbar (filters + actions) */
    .toolbar { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 10px 0 16px; }
    @media (min-width: 768px) { .toolbar { grid-template-columns: 1fr auto; align-items: start; } }
    .filters { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 12px; box-shadow: var(--shadow-sm); display: grid; gap: 10px; grid-template-columns: 1fr; }
    @media (min-width: 768px) { .filters { grid-template-columns: 1fr 180px 180px; } }
    .filters .group { display: flex; gap: 10px; align-items: center; }
    .filters label { font-size: var(--text-sm); color: var(--gray-700); }
    .filters input[type="text"], .filters select { width: 100%; padding: 8px 10px; border-radius: var(--radius-md); border: 1px solid var(--gray-300); background: white; font-size: var(--text-sm); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .btn { padding: 9px 12px; border-radius: var(--radius-md); border: 1px solid var(--gray-300); background: white; color: var(--gray-900); box-shadow: var(--shadow-sm); font-size: var(--text-sm); }
    .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn.success { background: var(--success); color: #fff; border-color: var(--success); }
    .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn.warn { background: var(--warning); color: #fff; border-color: var(--warning); }
    .btn.ghost { background: transparent; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Grid */
    .task-grid { display: grid; grid-template-columns: 1fr; gap: var(--grid-gap); }
    @media (min-width: 768px) { .task-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .task-grid { grid-template-columns: repeat(3, 1fr); } }

    /* Task card */
    .task-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: var(--card-padding); box-shadow: var(--shadow-sm); transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .task-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .task-card header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .priority-badge { padding: 4px 8px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 700; color: white; }
    .prio-critica { background: var(--danger); }
    .prio-alta { background: var(--warning); }
    .prio-media { background: var(--yellow); color: #111; }
    .prio-bassa { background: var(--success); }
    .task-card .actions { display: flex; gap: 6px; }

    .task-card h3 { margin: 0 0 6px; font-size: var(--text-lg); }
    .meta { color: var(--gray-700); font-size: var(--text-sm); display: flex; gap: 10px; flex-wrap: wrap; }
    .notes { margin: 8px 0 12px; font-size: var(--text-sm); color: var(--gray-900); white-space: pre-wrap; }

    .progress { height: 8px; background: var(--gray-100); border-radius: var(--radius-full); overflow: hidden; margin: 6px 0 10px; border: 1px solid var(--gray-200); }
    .progress .fill { height: 100%; background: linear-gradient(90deg, var(--primary), #60a5fa); width: 0%; transition: width 0.2s ease; }
    .controls { display: flex; gap: 6px; flex-wrap: wrap; }

    /* Empty state */
    .empty { text-align: center; color: var(--gray-700); padding: 32px; border: 1px dashed var(--gray-300); border-radius: var(--radius-lg); background: #fff; }

    /* Completed list */
    .completed-list { display: grid; gap: 10px; }
    .completed-item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 12px; }
    .completed-item .info { display: flex; gap: 10px; flex-wrap: wrap; color: var(--gray-700); }

    /* Settings */
    .settings-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
    @media (min-width: 768px) { .settings-grid { grid-template-columns: 1fr 1fr; } }
    .settings-card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); }
    .settings-card h4 { margin: 0 0 10px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--gray-300); border-radius: var(--radius-full); margin: 4px; background: var(--gray-100); }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-backdrop.open { display: flex; }
    .modal { width: 100%; max-width: 640px; background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow: hidden; }
    .modal header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--gray-200); }
    .modal .content { padding: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: var(--form-gap); }
    @media (min-width: 640px) { .form-grid { grid-template-columns: 1fr 1fr; } }
    .form-grid .full { grid-column: 1 / -1; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: var(--text-sm); color: var(--gray-700); }
    .field input, .field select, .field textarea { width: 100%; padding: 9px 10px; border-radius: var(--radius-md); border: 1px solid var(--gray-300); font-size: var(--text-sm); background: white; }
    .help { font-size: var(--text-xs); color: var(--gray-500); }

    /* Micro-interactions */
    .button:hover { opacity: 0.92; }
    .loading { animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

    /* Footer note */
    footer { text-align: center; color: var(--gray-500); font-size: var(--text-xs); margin: 24px 0 10px; }
  
/* --- Stats layout refinements --- */
.charts-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .charts-grid { grid-template-columns: 1fr 1fr; } }
.chart-box { background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius-lg); padding:12px; }
.chart-box h4 { margin: 0 0 8px; font-size: var(--text-base); }
.stats-table { margin-top:8px; width:100%; border-collapse: collapse; font-size: var(--text-sm); }
.stats-table th, .stats-table td { padding: 6px 8px; border-bottom: 1px dashed var(--gray-200); }
.stats-table th { text-align: left; color: var(--gray-700); font-weight: 600; }
.stats-table td { text-align: right; font-weight: 700; }
.stats-canvas { width: 100%; height: 220px; display:block; }

  
/* --- Compact chart containers --- */
.chart-container { position: relative; width: 100%; height: 160px; }
@media (max-width: 640px) { .chart-container { height: 140px; } }
.stats-canvas { width: 100% !important; height: 100% !important; display: block; }

  </style>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <header class="app-header" aria-label="intestazione">
      <div class="title"><span class="emoji">🗂️</span> Task Manager <span id="dataOggi" class="today"></span></div>
      <div class="actions">
        <button id="btnNuovo" class="btn primary" aria-label="Nuova attività">➕ Nuova</button>
        <button id="btnEsporta" class="btn" aria-label="Esporta dati">⬇️ Esporta</button>
        <button id="btnImporta" class="btn" aria-label="Importa dati">⬆️ Importa</button>
        <input id="fileImport" type="file" accept="application/json" style="display:none" />
      </div>
    </header>

    <!-- Stats quick -->
    <section class="stats" aria-label="metriche">
      <div class="stat"><div class="label">In corso</div><div class="value" id="mInCorso">0</div></div>
      <div class="stat"><div class="label">Critiche</div><div class="value" id="mCritiche">0</div></div>
      <div class="stat"><div class="label">Scadute</div><div class="value" id="mScadute">0</div></div>
      <div class="stat"><div class="label">Completate (30g)</div><div class="value" id="mCompletateMese">0</div></div>
    </section>

    <!-- Tabs -->
    <nav class="tabs" role="tablist" aria-label="navigazione principali">
      <button class="tab active" data-tab="tutte" role="tab">🔋 Tutte</button>
      <button class="tab" data-tab="critiche" role="tab">🚨 Critiche</button>
      <button class="tab" data-tab="completate" role="tab">✅ Completate</button>
      <button class="tab" data-tab="statistiche" role="tab">📊 Statistiche</button>
      <button class="tab" data-tab="impostazioni" role="tab">⚙️ Impostazioni</button>
    </nav>

    <!-- Toolbar: filters + actions -->
    <section class="toolbar" aria-label="strumenti">
      <div class="filters">
        <div class="group">
          <label for="q">🔎 Ricerca</label>
          <input id="q" type="text" placeholder="Titolo o note…" aria-label="Ricerca" />
        </div>
        <div class="group">
          <label for="fPrio">⏫ Priorità</label>
          <select id="fPrio" aria-label="Filtro priorità">
            <option value="all">Tutte</option>
            <option value="critica">Critica</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="bassa">Bassa</option>
          </select>
        </div>
        <div class="group">
          <label for="fDue">📅 Scadenza</label>
          <select id="fDue" aria-label="Filtro scadenza">
            <option value="all">Tutte</option>
            <option value="overdue">Scadute</option>
            <option value="today">Oggi</option>
            <option value="next7">Prossimi 7 giorni</option>
            <option value="nodue">Senza scadenza</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button id="btnPulisciFiltri" class="btn ghost">🧹 Pulisci filtri</button>
      </div>
    </section>

    <!-- Content -->
    <main id="content" aria-live="polite"></main>

    <footer>Standalone HTML – nessuna build. Nota: PWA/Service Worker non inclusi in singolo file.</footer>
  </div>

  <!-- MODAL: Task Form -->
  <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal" role="document">
      <header>
        <div id="modalTitle" class="title" style="font-size:1.1rem">✏️ Nuova attività</div>
        <button id="modalClose" class="btn">✖</button>
      </header>
      <div class="content">
        <form id="taskForm" autocomplete="off">
          <input type="hidden" id="taskId" />
          <div class="form-grid">
            <div class="field full">
              <label for="title">Titolo <span style="color:var(--danger)">*</span></label>
              <input id="title" required placeholder="Esempio: Preparare presentazione" />
            </div>
            <div class="field">
              <label for="project">Progetto</label>
              <select id="project"></select>
            </div>
            <div class="field">
              <label for="assignee">Assegnatario</label>
              <select id="assignee"></select>
            </div>
            <div class="field">
              <label for="priority">Priorità</label>
              <select id="priority">
                <option value="bassa">Bassa</option>
                <option value="media">Media</option>
                <option value="alta">Alta</option>
                <option value="critica">Critica</option>
              </select>
            </div>
            <div class="field">
              <label for="progress">Progresso (%)</label>
              <input id="progress" type="number" min="0" max="100" step="1" value="0" />
              <div class="help">0–100</div>
            </div>
            <div class="field">
              <label for="dueDate">Scadenza</label>
              <input id="dueDate" type="date" />
            </div>
            <div class="field full">
              <label for="notes">Note</label>
              <textarea id="notes" rows="3" placeholder="Dettagli, link, checklist…"></textarea>
            </div>
          </div>
          <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:14px;">
            <button type="button" class="btn" id="btnAnnulla">Annulla</button>
            <button type="submit" class="btn primary" id="btnSalva">Salva</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
  // ==============================
  //  DATA MODEL & DEFAULT SETUP
  // ==============================
  const defaultProjects = [
    "Progetti ordinari",
    "Progetti strategici",
    "Piani industriali",
    "Collaboratori",
    "Finanza",
    "Hub",
    "Formazione",
    "Marketing"
  ];

  const defaultPeoples = [
    "Roberto",
    "Roberto & Carlo",
    "Roberto & Carlo & Nicola",
    "Carlo",
    "Nicola",
    "Team",
    "Consulente esterno"
  ];

  const STORAGE_KEY = 'tm_standalone_v1';
  const SAVE_DEBOUNCE_MS = 300;

  /** @typedef {Object} Task */
  /** @type {{
   *  tasks: Task[],
   *  completedTasks: Task[],
   *  projects: string[],
   *  people: string[],
   *  tab: 'tutte'|'critiche'|'completate'|'statistiche'|'impostazioni',
   *  filters: { priority: 'all'|'bassa'|'media'|'alta'|'critica', due: 'all'|'overdue'|'today'|'next7'|'nodue' },
   *  q: string
   * }} */
  const state = {
    tasks: [],
    completedTasks: [],
    projects: [...defaultProjects],
    people: [...defaultPeoples],
    tab: 'tutte',
    filters: { priority: 'all', due: 'all' },
    q: ''
  };

  let saveTimer = null;

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const payload = { tasks: state.tasks, completedTasks: state.completedTasks, projects: state.projects, people: state.people };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }, SAVE_DEBOUNCE_MS);
  }

  function load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      try {
        const data = JSON.parse(raw);
        state.tasks = Array.isArray(data.tasks) ? data.tasks : [];
        state.completedTasks = Array.isArray(data.completedTasks) ? data.completedTasks : [];
        state.projects = Array.isArray(data.projects) && data.projects.length ? data.projects : [...defaultProjects];
        state.people = Array.isArray(data.people) && data.people.length ? data.people : [...defaultPeoples];
      } catch (e) {
        console.warn('Dati corrotti, avvio con default.');
      }
    }
  }

  // ==============================
  //  UTILITIES
  // ==============================
  const fmtDate = (d) => new Intl.DateTimeFormat('it-IT', { dateStyle: 'medium' }).format(d);
  const todayISO = () => new Date().toISOString().slice(0,10);
  const parseISO = (s) => s ? new Date(s + 'T00:00:00') : null;

  function isOverdue(dueISO) {
    if (!dueISO) return false;
    const due = parseISO(dueISO);
    const today = new Date(); today.setHours(0,0,0,0);
    return due && due < today;
  }
  function isDueToday(dueISO) {
    if (!dueISO) return false;
    return dueISO === todayISO();
  }
  function isDueSoon(dueISO, days) {
    if (!dueISO) return false;
    const due = parseISO(dueISO);
    const today = new Date(); today.setHours(0,0,0,0);
    const soon = new Date(today); soon.setDate(soon.getDate() + days);
    return due >= today && due <= soon;
  }

  function genId() { return Date.now() + Math.floor(Math.random()*100000); }

  const PRIORITY_ORDER = { critica: 0, alta: 1, media: 2, bassa: 3 };
  function sortTasks(a, b) {
    const pa = PRIORITY_ORDER[a.priority] ?? 3;
    const pb = PRIORITY_ORDER[b.priority] ?? 3;
    if (pa !== pb) return pa - pb;
    // by due date (nulls last)
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if (a.dueDate && !b.dueDate) return -1;
    if (!a.dueDate && b.dueDate) return 1;
    return a.title.localeCompare(b.title, 'it');
  }

  function applyFilters(list) {
    let res = [...list];
    const { priority, due } = state.filters;
    const q = state.q.trim().toLowerCase();

    if (priority !== 'all') {
      res = res.filter(t => t.priority === priority);
    }
    if (due !== 'all') {
      if (due === 'overdue') res = res.filter(t => isOverdue(t.dueDate));
      if (due === 'today') res = res.filter(t => isDueToday(t.dueDate));
      if (due === 'next7') res = res.filter(t => isDueSoon(t.dueDate, 7));
      if (due === 'nodue') res = res.filter(t => !t.dueDate);
    }
    if (q) {
      res = res.filter(t => (t.title + ' ' + (t.notes||'')).toLowerCase().includes(q));
    }
    return res.sort(sortTasks);
  }

  // ==============================
  //  RENDERING
  // ==============================
  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

  function setToday() {
    $('#dataOggi').textContent = '· ' + fmtDate(new Date());
  }

  function render() {
    // header metrics
    const inCorso = state.tasks.length;
    const critiche = state.tasks.filter(t => t.priority === 'critica').length;
    const scadute = state.tasks.filter(t => isOverdue(t.dueDate)).length;
    const now = new Date(); const past30 = new Date(); past30.setDate(now.getDate()-30);
    const completateMese = state.completedTasks.filter(t => t.completedDate && new Date(t.completedDate) >= past30).length;

    $('#mInCorso').textContent = inCorso;
    $('#mCritiche').textContent = critiche;
    $('#mScadute').textContent = scadute;
    $('#mCompletateMese').textContent = completateMese;

    // tabs active
    $$('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));

    // content by tab
    const mount = $('#content');
    mount.innerHTML = '';
    if (state.tab === 'tutte' || state.tab === 'critiche') {
      const list = state.tab === 'critiche' ? state.tasks.filter(t => t.priority==='critica') : state.tasks;
      renderTaskList(mount, applyFilters(list));
    } else if (state.tab === 'completate') {
      renderCompleted(mount);
    } else if (state.tab === 'statistiche') {
      renderStats(mount);
    } else if (state.tab === 'impostazioni') {
      renderSettings(mount);
    }
  }

  function pill(text) { const s=document.createElement('span'); s.className='pill'; s.textContent=text; return s; }

  function renderTaskList(root, list) {
    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Nessuna attività. Aggiungi la prima con “Nuova”.';
      root.appendChild(empty);
      return;
    }
    const grid = document.createElement('div');
    grid.className = 'task-grid';
    list.forEach(task => grid.appendChild(taskCard(task)));
    root.appendChild(grid);
  }

  function taskCard(task) {
    const card = document.createElement('div');
    card.className = 'task-card';

    const header = document.createElement('header');
    const prio = document.createElement('span');
    prio.className = `priority-badge prio-${task.priority}`;
    prio.textContent = task.priority.toUpperCase();

    const actions = document.createElement('div');
    actions.className = 'actions';
    const bEdit = btn('✏️', () => openModal(task));
    bEdit.title = 'Modifica';
    const bDel = btn('🗑️', () => onDelete(task.id), 'danger'); bDel.title = 'Elimina';
    actions.append(bEdit, bDel);

    header.append(prio, actions);

    const h3 = document.createElement('h3'); h3.textContent = task.title;

    const meta = document.createElement('div'); meta.className = 'meta';
    meta.innerHTML = `👤 ${task.assignee || '—'} · 📂 ${task.project || '—'} · 📅 ${task.dueDate ? fmtDate(parseISO(task.dueDate)) : '—'}`;

    const notes = document.createElement('div'); notes.className='notes'; if (task.notes) notes.textContent = task.notes; else notes.style.display='none';

    const progress = document.createElement('div'); progress.className='progress';
    const fill = document.createElement('div'); fill.className='fill'; fill.style.width = (task.progress||0) + '%'; progress.appendChild(fill);

    const controls = document.createElement('div'); controls.className='controls';
    const bPlus = btn('+10%', () => onUpdateProgress(task.id, +10));
    const bMinus = btn('-10%', () => onUpdateProgress(task.id, -10));
    const bComplete = btn('✅ Completa', () => onComplete(task.id), 'success');
    controls.append(bPlus, bMinus, bComplete);

    card.append(header, h3, meta, notes, progress, controls);
    return card;
  }

  function renderCompleted(root) {
    if (!state.completedTasks.length) {
      const empty = document.createElement('div'); empty.className='empty'; empty.textContent='Nessuna attività completata.'; root.appendChild(empty); return;
    }
    const list = document.createElement('div'); list.className='completed-list';
    state.completedTasks
      .slice()
      .sort((a,b) => (b.completedDate||'').localeCompare(a.completedDate||''))
      .forEach(t => {
        const item = document.createElement('div'); item.className='completed-item';
        const info = document.createElement('div'); info.className='info';
        const dt = t.completedDate ? fmtDate(new Date(t.completedDate)) : '—';
        info.textContent = `✅ ${t.title} · ${t.assignee||'—'} · ${t.project||'—'} · Completata: ${dt}`;
        const act = document.createElement('div');
        const bRestore = btn('↩️ Ripristina', () => onRestore(t.id));
        act.appendChild(bRestore);
        item.append(info, act); list.appendChild(item);
      });
    root.appendChild(list);
  }

  let charts = { donut:null, line:null, bar:null };
  
function renderStats(root) {
    const wrap = document.createElement('div');
    wrap.style.display='grid'; 
    wrap.style.gap='16px';

    // quick metrics
    const total = state.tasks.length + state.completedTasks.length;
    const opened = state.tasks.length;
    const done = state.completedTasks.length;
    const criticalOpen = state.tasks.filter(t=>t.priority==='critica').length;

    wrap.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="label">Totale</div><div class="value">${total}</div></div>
        <div class="stat"><div class="label">In corso</div><div class="value">${opened}</div></div>
        <div class="stat"><div class="label">Completate</div><div class="value">${done}</div></div>
        <div class="stat"><div class="label">Critiche aperte</div><div class="value">${criticalOpen}</div></div>
      </div>

      <div class="charts-grid">
        <div class="chart-box">
          <h4>Stato complessivo</h4>
          <div class="chart-container"><canvas id="chDonut" class="stats-canvas"></canvas></div>
          <table class="stats-table" aria-label="Tabella stato complessivo">
            <tr><th>In corso</th><td>${opened}</td></tr>
            <tr><th>Completate</th><td>${done}</td></tr>
            <tr><th>Totale</th><td>${total}</td></tr>
          </table>
        </div>

        <div class="chart-box">
          <h4>Distribuzione priorità (aperte)</h4>
          <div class="chart-container"><canvas id="chBar" class="stats-canvas"></canvas></div>
          <table class="stats-table" aria-label="Tabella distribuzione priorità aperte">
            ${['critica','alta','media','bassa'].map(p => {
              const label = p.charAt(0).toUpperCase() + p.slice(1);
              const count = state.tasks.filter(t=>t.priority===p).length;
              return `<tr><th>${label}</th><td>${count}</td></tr>`;
            }).join('')}
          </table>
        </div>

        <div class="chart-box" style="grid-column: 1 / -1;">
          <h4>Completamenti ultimi 14 giorni</h4>
          <div class="chart-container"><canvas id="chLine" class="stats-canvas"></canvas></div>
          <table class="stats-table" aria-label="Tabella completamenti ultimi 14 giorni">
            ${(() => {
              const days = [...Array(14)].map((_,i) => { const d=new Date(); d.setDate(d.getDate()-(13-i)); return d; });
              const rows = days.map(d => {
                const iso = d.toISOString().slice(0,10);
                const count = state.completedTasks.filter(t => t.completedDate && t.completedDate.slice(0,10) === iso).length;
                return `<tr><th>${d.toLocaleDateString('it-IT', { weekday:'short', day:'2-digit', month:'2-digit' })}</th><td>${count}</td></tr>`;
              });
              // summary row
              const total14 = days.reduce((acc,d)=>{
                const iso = d.toISOString().slice(0,10);
                return acc + state.completedTasks.filter(t => t.completedDate && t.completedDate.slice(0,10) === iso).length;
              },0);
              rows.push(`<tr><th>Totale (14g)</th><td>${total14}</td></tr>`);
              return rows.join('');
            })()}
          </table>
        </div>
      </div>
    `;
    root.appendChild(wrap);

    // ----- Charts (smaller + responsive) -----
    const donutData = [opened, done];

    const ctx1 = document.getElementById('chDonut').getContext('2d');
    charts.donut && charts.donut.destroy();
    charts.donut = new Chart(ctx1, {
      type: 'doughnut',
      data: { labels: ['In corso', 'Completate'], datasets: [{ data: donutData, backgroundColor: ['#1d4ed8', '#22c55e'] }] },
      options: { 
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' } },
        animation: false
      }
    });

    // line: completate per giorno (ultimi 14 giorni)
    const days = [...Array(14)].map((_,i) => { const d=new Date(); d.setDate(d.getDate()-(13-i)); return d; });
    const labels = days.map(d => d.toLocaleDateString('it-IT', { day:'2-digit', month:'2-digit' }));
    const completeCounts = days.map(d => {
      const iso = d.toISOString().slice(0,10);
      return state.completedTasks.filter(t => t.completedDate && t.completedDate.slice(0,10) === iso).length;
    });
    const ctx2 = document.getElementById('chLine').getContext('2d');
    charts.line && charts.line.destroy();
    charts.line = new Chart(ctx2, {
      type: 'line',
      data: { labels, datasets: [{ label: 'Completate', data: completeCounts, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.2)', tension: 0.25, fill: true }] },
      options: { 
        maintainAspectRatio: false,
        plugins: { legend: { display: false } }, 
        scales: { y: { beginAtZero: true, precision: 0 } },
        animation: false
      }
    });

    // bar: priorità aperte
    const prios = ['critica','alta','media','bassa'];
    const counts = prios.map(p => state.tasks.filter(t=>t.priority===p).length);
    const ctx3 = document.getElementById('chBar').getContext('2d');
    charts.bar && charts.bar.destroy();
    charts.bar = new Chart(ctx3, {
      type: 'bar',
      data: { labels: prios.map(p=>p.toUpperCase()), datasets: [{ label:'Aperte', data: counts, backgroundColor: ['#dc2626','#f97316','#facc15','#22c55e'] }] },
      options: { 
        maintainAspectRatio: false,
        plugins: { legend: { display:false } }, 
        scales: { y: { beginAtZero:true, precision:0 } },
        animation: false
      }
    });
}

  function renderSettings(root) {
    const grid = document.createElement('div'); grid.className='settings-grid';

    // Projects
    const cardP = document.createElement('div'); cardP.className='settings-card';
    cardP.innerHTML = `<h4>📂 Progetti</h4>`;
    const listP = document.createElement('div'); state.projects.forEach(p => { const el=pill(p); const rm=btn('✖',()=>removeProject(p)); el.appendChild(rm); listP.appendChild(el); });
    const addPwrap = document.createElement('div'); addPwrap.style.marginTop='8px'; addPwrap.style.display='flex'; addPwrap.style.gap='8px';
    const inpP = document.createElement('input'); inpP.placeholder='Nuovo progetto'; inpP.className='field'; inpP.style.flex='1';
    const addP = btn('Aggiungi', ()=>{ const v=inpP.value.trim(); if(!v) return; addProject(v); inpP.value=''; }); addP.classList.add('primary');
    addPwrap.append(inpP, addP);
    cardP.append(listP, addPwrap);

    // People
    const cardPe = document.createElement('div'); cardPe.className='settings-card';
    cardPe.innerHTML = `<h4>👤 Persone</h4>`;
    const listPe = document.createElement('div'); state.people.forEach(p => { const el=pill(p); const rm=btn('✖',()=>removePerson(p)); el.appendChild(rm); listPe.appendChild(el); });
    const addPeWrap = document.createElement('div'); addPeWrap.style.marginTop='8px'; addPeWrap.style.display='flex'; addPeWrap.style.gap='8px';
    const inpPe = document.createElement('input'); inpPe.placeholder='Nuova persona'; inpPe.className='field'; inpPe.style.flex='1';
    const addPe = btn('Aggiungi', ()=>{ const v=inpPe.value.trim(); if(!v) return; addPerson(v); inpPe.value=''; }); addPe.classList.add('primary');
    addPeWrap.append(inpPe, addPe);
    cardPe.append(listPe, addPeWrap);

    grid.append(cardP, cardPe);
    root.appendChild(grid);
  }

  function btn(label, onClick, kind) {
    const b = document.createElement('button'); b.className='btn' + (kind? ' ' + kind : ''); b.textContent=label; b.addEventListener('click', onClick); return b;
  }

  // ==============================
  //  ACTIONS (CRUD + FILTERS)
  // ==============================
  function addTask(partial) {
    const t = {
      id: genId(),
      title: partial.title.trim(),
      project: partial.project || '',
      assignee: partial.assignee || '',
      priority: partial.priority || 'bassa',
      progress: clamp(parseInt(partial.progress||0,10), 0, 100),
      dueDate: partial.dueDate || null,
      notes: partial.notes || '',
    };
    state.tasks.push(t); save(); render();
  }

  function updateTask(id, updates) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    Object.assign(t, updates);
    t.progress = clamp(parseInt(t.progress||0,10), 0, 100);
    save(); render();
  }

  function onDelete(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    if (confirm(`Eliminare definitivamente "${t.title}"?`)) {
      state.tasks = state.tasks.filter(x => x.id !== id);
      save(); render();
    }
  }

  function onUpdateProgress(id, delta) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    t.progress = clamp((t.progress||0) + delta, 0, 100);
    save(); render();
  }

  function onComplete(id) {
    const idx = state.tasks.findIndex(x => x.id === id);
    if (idx === -1) return;
    const t = state.tasks.splice(idx,1)[0];
    t.progress = 100; t.completedDate = new Date().toISOString();
    state.completedTasks.push(t);
    save(); render();
  }

  function onRestore(id) {
    const idx = state.completedTasks.findIndex(x => x.id === id);
    if (idx === -1) return;
    const t = state.completedTasks.splice(idx,1)[0];
    t.progress = Math.min(90, t.progress||0); delete t.completedDate;
    state.tasks.push(t);
    save(); render();
  }

  function setTab(tab) { state.tab = tab; render(); }

  function setFilters(partial) { state.filters = { ...state.filters, ...partial }; render(); }
  function setQuery(q) { state.q = q; render(); }
  function clearFilters() { state.filters={priority:'all', due:'all'}; state.q=''; $('#q').value=''; $('#fPrio').value='all'; $('#fDue').value='all'; render(); }

  // ==============================
  //  IMPORT/EXPORT
  // ==============================
  function exportData() {
    const data = { tasks: state.tasks, completedTasks: state.completedTasks, projects: state.projects, people: state.people, exportedAt: new Date().toISOString() };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'task_manager_export.json'; a.click();
    URL.revokeObjectURL(url);
  }

  function validateImportData(data) {
    if (typeof data !== 'object' || !data) return false;
    if (!('tasks' in data) || !('completedTasks' in data)) return false;
    return Array.isArray(data.tasks) && Array.isArray(data.completedTasks);
  }

  function importData(json, mode='merge') {
    let data;
    try { data = JSON.parse(json); } catch { alert('JSON non valido'); return; }
    if (!validateImportData(data)) { alert('Struttura dati non valida'); return; }

    if (mode === 'replace') {
      state.tasks = data.tasks || [];
      state.completedTasks = data.completedTasks || [];
      state.projects = data.projects && data.projects.length ? data.projects : state.projects;
      state.people = data.people && data.people.length ? data.people : state.people;
    } else {
      // merge: concat e dedup per id
      const byId = new Map();
      [...state.tasks, ...data.tasks].forEach(t => byId.set(t.id, t));
      state.tasks = [...byId.values()].filter(t => !t.completedDate);

      const byIdC = new Map();
      [...state.completedTasks, ...data.completedTasks].forEach(t => byIdC.set(t.id, t));
      state.completedTasks = [...byIdC.values()].filter(t => t.completedDate);

      // unione liste
      state.projects = Array.from(new Set([...(data.projects||[]), ...state.projects]));
      state.people = Array.from(new Set([...(data.people||[]), ...state.people]));
    }
    save(); render();
  }

  // ==============================
  //  SETTINGS ACTIONS
  // ==============================
  function addProject(p) { if (!state.projects.includes(p)) { state.projects.push(p); save(); render(); } }
  function removeProject(p) {
    if (!confirm(`Rimuovere il progetto "${p}"?`)) return;
    state.projects = state.projects.filter(x => x !== p);
    // pulizia tasks associati? no, manteniamo il valore testuale
    save(); render();
  }
  function addPerson(p) { if (!state.people.includes(p)) { state.people.push(p); save(); render(); } }
  function removePerson(p) {
    if (!confirm(`Rimuovere la persona "${p}"?`)) return;
    state.people = state.people.filter(x => x !== p);
    save(); render();
  }

  // ==============================
  //  MODAL & FORM HANDLING
  // ==============================
  const modal = $('#modal');
  const modalTitle = $('#modalTitle');
  const f = {
    id: $('#taskId'),
    title: $('#title'),
    project: $('#project'),
    assignee: $('#assignee'),
    priority: $('#priority'),
    progress: $('#progress'),
    dueDate: $('#dueDate'),
    notes: $('#notes'),
  };

  function openModal(task=null) {
    modal.classList.add('open'); modal.setAttribute('aria-hidden','false');
    // populate selects
    f.project.innerHTML = `<option value="">—</option>` + state.projects.map(p=>`<option>${p}</option>`).join('');
    f.assignee.innerHTML = `<option value="">—</option>` + state.people.map(p=>`<option>${p}</option>`).join('');

    if (task) {
      modalTitle.textContent = '✏️ Modifica attività';
      f.id.value = String(task.id);
      f.title.value = task.title;
      f.project.value = task.project || '';
      f.assignee.value = task.assignee || '';
      f.priority.value = task.priority || 'bassa';
      f.progress.value = String(task.progress||0);
      f.dueDate.value = task.dueDate || '';
      f.notes.value = task.notes || '';
    } else {
      modalTitle.textContent = '➕ Nuova attività';
      f.id.value = '';
      f.title.value = '';
      f.project.value = '';
      f.assignee.value = '';
      f.priority.value = 'bassa';
      f.progress.value = '0';
      f.dueDate.value = '';
      f.notes.value = '';
    }
    setTimeout(() => f.title.focus(), 0);
  }
  function closeModal() { modal.classList.remove('open'); modal.setAttribute('aria-hidden','true'); }

  $('#modalClose').addEventListener('click', closeModal);
  $('#btnAnnulla').addEventListener('click', (e)=>{ e.preventDefault(); closeModal(); });
  $('#taskForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    if (!f.title.value.trim()) { alert('Il titolo è obbligatorio'); f.title.focus(); return; }
    const payload = {
      title: f.title.value,
      project: f.project.value,
      assignee: f.assignee.value,
      priority: f.priority.value,
      progress: parseInt(f.progress.value||'0',10),
      dueDate: f.dueDate.value || null,
      notes: f.notes.value
    };
    const id = f.id.value ? parseInt(f.id.value,10) : null;
    if (id) updateTask(id, payload); else addTask(payload);
    closeModal();
  });

  // ==============================
  //  EVENT LISTENERS (UI)
  // ==============================
  $('#btnNuovo').addEventListener('click', () => openModal());
  $('#btnEsporta').addEventListener('click', exportData);
  $('#btnImporta').addEventListener('click', () => $('#fileImport').click());
  $('#fileImport').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const mode = prompt('Modalità import: "merge" (default) o "replace"?', 'merge') || 'merge';
      importData(String(reader.result), mode === 'replace' ? 'replace' : 'merge');
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  $$('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

  $('#q').addEventListener('input', (e)=> setQuery(e.target.value));
  $('#fPrio').addEventListener('change', (e)=> setFilters({ priority: e.target.value }));
  $('#fDue').addEventListener('change', (e)=> setFilters({ due: e.target.value }));
  $('#btnPulisciFiltri').addEventListener('click', clearFilters);

  // ==============================
  //  HELPERS
  // ==============================
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  // ==============================
  //  INIT
  // ==============================
  setToday();
  load();
  render();

  </script>
</body>
</html>
